name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows tests and builds
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            python-sidecar/requirements.txt
            scripts/requirements-audit.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check --require-hashes -r python-sidecar/requirements.txt
          python -m venv .audit-venv
          .\.audit-venv\Scripts\python.exe -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-audit.txt

      - name: Install Rust dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Check public repository hygiene
        shell: pwsh
        run: ./scripts/public_repo_check.ps1

      - name: Audit dependencies
        run: |
          npm audit --audit-level=moderate
          npm run audit:dependencies
          npm run audit:licenses

      - name: Run TypeScript logic tests
        run: npm test

      - name: Build desktop frontend
        run: npm run build

      - name: Check Rust formatting and lints
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Python tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s python-sidecar/tests -p "test_*.py"

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run app demo E2E
        run: npm run test:e2e

      - name: Run production frontend E2E
        run: npm run test:e2e:release


  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan Git history with gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
