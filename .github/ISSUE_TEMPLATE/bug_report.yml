name: Bug report
description: 再現可能な不具合を報告する
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 動画、字幕、絶対パス、ライセンスキー、秘密情報を添付しないでください。脆弱性はSECURITY.mdの非公開窓口へ報告してください。
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何をしようとして、何が起きたかを記載してください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. 動画を読み込む
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TateClipのバージョンまたはcommit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows / GPU
      placeholder: Windows 11 24H2 / Radeon ...
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 秘密情報を除いた診断情報
      description: 動画名、絶対パス、字幕本文などを削除して貼り付けてください。
